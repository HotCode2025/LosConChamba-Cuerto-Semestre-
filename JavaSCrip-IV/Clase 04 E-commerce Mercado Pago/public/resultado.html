<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles.css">
    <title>Resultado del pago | Los Sin Chamba</title>
</head>
<body>
    <!--Parte 7: acá vuelve Mercado Pago después de pagar (back_urls)-->
    <div class="result-card">
        <h1 class="result-icon" id="result-icon">⏳</h1>
        <h2 id="result-title">Procesando el pago...</h2>
        <p id="result-detail"></p>
        <a class="checkout-btn" href="./index.html">Volver a la tienda</a>
    </div>

    <script>
      const params = new URLSearchParams(window.location.search);
      const status = params.get("status") || params.get("collection_status") || "unknown";
      const paymentId = params.get("payment_id") || params.get("collection_id");

      const estados = {
        approved: { icon: "✅", title: "¡Pago aprobado!", detail: "Tu compra se acreditó correctamente." },
        pending: { icon: "🕒", title: "Pago pendiente", detail: "Mercado Pago todavía está confirmando el pago." },
        in_process: { icon: "🕒", title: "Pago en revisión", detail: "Mercado Pago está revisando el pago." },
        rejected: { icon: "❌", title: "Pago rechazado", detail: "El pago no pudo procesarse, probá con otro medio." },
        null: { icon: "❓", title: "Sin datos del pago", detail: "Volvé a la tienda e intentá de nuevo." },
      };

      const resultado = estados[status] || estados.null;

      document.getElementById("result-icon").innerText = resultado.icon;
      document.getElementById("result-title").innerText = resultado.title;
      document.getElementById("result-detail").innerText = paymentId
        ? `${resultado.detail} (N° de pago: ${paymentId})`
        : resultado.detail;
    </script>
</body>
</html>
